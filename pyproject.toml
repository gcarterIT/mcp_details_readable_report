[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-details-readable-report"
version = "0.0.0"
description = "Human-readable reporting for structured MCP Details inspection results."
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]